# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '33 5 * * 2'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Node.js for JavaScript/TypeScript analysis
      - name: Set up Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Install dependencies for JavaScript/TypeScript analysis
      - name: Install dependencies
        if: matrix.language == 'javascript-typescript'
        run: npm install

      # Initialize CodeQL BEFORE build steps
      - name: Initialize CodeQL  
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Set up Emscripten for C++ analysis
      - name: Set up Emscripten SDK
        if: matrix.language == 'c-cpp'
        shell: bash
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh
          # Create build directory
          mkdir -p packages/router-core/build
        working-directory: ${{ github.workspace }}

      # Configure and build C++ with CodeQL tracing
      - name: Configure and Build C++ with CodeQL Tracing
        if: matrix.language == 'c-cpp'
        shell: bash
        run: |
          source emsdk/emsdk_env.sh
          # Configure Emscripten build and wrap it with CodeQL tracing
          codeql database trace-command -- \
            emcmake cmake -S packages/router-core/src -B packages/router-core/build
          # Wrap the actual build step with CodeQL tracing
          codeql database trace-command -- \
            cmake --build packages/router-core/build
        working-directory: ${{ github.workspace }}

      # Build TypeScript for JavaScript/TypeScript analysis
      - name: Build TypeScript
        if: matrix.language == 'javascript-typescript'
        run: |
          npm run build --workspace=@seasight/web

      # Perform the analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"